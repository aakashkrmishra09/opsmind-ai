services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opsmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsmind
      POSTGRES_PASSWORD: opsmind_dev_password
      POSTGRES_DB: opsmind
    ports:
      - "5432:5432"
    volumes:
      - opsmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmind -d opsmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opsmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - opsmind_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  opsmind_pgdata:
  opsmind_redisdata: